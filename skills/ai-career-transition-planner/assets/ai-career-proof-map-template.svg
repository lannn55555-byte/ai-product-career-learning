<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI Career Proof Map card template</title>
  <desc id="desc">A shareable career-transition card with role direction, proof points, capability map, gaps and next action.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5037D5"/>
      <stop offset="1" stop-color="#7D62F4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2B2450" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans { font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; }
      .label { font-size: 18px; font-weight: 700; letter-spacing: 2.2px; }
      .small { font-size: 18px; }
      .body { font-size: 22px; }
      .h2 { font-size: 28px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#F7F7FA"/>
  <rect x="60" y="60" width="1480" height="880" rx="34" fill="#FFFFFF" filter="url(#shadow)"/>

  <path d="M60 94Q60 60 94 60H1506Q1540 60 1540 94V298H60Z" fill="url(#hero)"/>
  <circle cx="1450" cy="125" r="180" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="1510" cy="300" r="118" fill="#FFFFFF" opacity="0.08"/>

  <text x="118" y="125" class="sans label" fill="#DCD5FF">AI CAREER PROOF MAP</text>
  <text x="118" y="196" class="sans" font-size="52" font-weight="750" fill="#FFFFFF">SaaS PM  →  AI Agent PM</text>
  <text x="118" y="244" class="sans body" fill="#E8E4FF">把真实企业流程能力，转化为可信的 AI 产品证据</text>

  <rect x="1220" y="112" width="220" height="122" rx="22" fill="#FFFFFF" opacity="0.16"/>
  <text x="1250" y="154" class="sans small" fill="#E8E4FF">EVIDENCE READINESS</text>
  <text x="1250" y="205" class="sans" font-size="46" font-weight="750" fill="#FFFFFF">50 <tspan font-size="22" font-weight="500">/ 60</tspan></text>

  <text x="118" y="358" class="sans label" fill="#7D62F4">LEAD WITH / 主动主张</text>
  <line x1="118" y1="382" x2="1482" y2="382" stroke="#E7E5F0" stroke-width="2"/>

  <g class="sans">
    <rect x="118" y="420" width="410" height="160" rx="20" fill="#F4F1FF"/>
    <circle cx="162" cy="464" r="20" fill="#684BE8"/>
    <text x="154" y="471" font-size="20" font-weight="750" fill="#FFFFFF">1</text>
    <text x="200" y="470" class="h2" fill="#242036">流程与异常设计</text>
    <text x="162" y="520" class="body" fill="#5B566B">审批状态 · 升级路径 · 例外处理</text>

    <rect x="555" y="420" width="410" height="160" rx="20" fill="#F4F1FF"/>
    <circle cx="599" cy="464" r="20" fill="#684BE8"/>
    <text x="591" y="471" font-size="20" font-weight="750" fill="#FFFFFF">2</text>
    <text x="637" y="470" class="h2" fill="#242036">数据与权限边界</text>
    <text x="599" y="520" class="body" fill="#5B566B">CRM 字段 · SOP · 访问控制</text>

    <rect x="992" y="420" width="490" height="160" rx="20" fill="#F4F1FF"/>
    <circle cx="1036" cy="464" r="20" fill="#684BE8"/>
    <text x="1028" y="471" font-size="20" font-weight="750" fill="#FFFFFF">3</text>
    <text x="1074" y="470" class="h2" fill="#242036">人机协作意识</text>
    <text x="1036" y="520" class="body" fill="#5B566B">人工接管 · 风险提示 · 责任边界</text>
  </g>

  <g class="sans">
    <text x="118" y="660" class="sans label" fill="#7D62F4">CAPABILITY MAP / 能力坐标</text>
    <rect x="118" y="690" width="700" height="180" rx="20" fill="#FBFAFE" stroke="#E7E5F0" stroke-width="2"/>
    <line x1="210" y1="820" x2="742" y2="820" stroke="#BAB5CC" stroke-width="2"/>
    <line x1="210" y1="820" x2="210" y2="730" stroke="#BAB5CC" stroke-width="2"/>
    <text x="215" y="850" class="small" fill="#777184">证据弱</text>
    <text x="665" y="850" class="small" fill="#777184">证据强</text>
    <text x="127" y="742" class="small" fill="#777184">AI 缺口大</text>
    <text x="127" y="808" class="small" fill="#777184">AI 缺口小</text>
    <circle cx="651" cy="786" r="12" fill="#2EB67D"/>
    <text x="670" y="793" class="small" fill="#312B44">流程与异常</text>
    <circle cx="628" cy="752" r="12" fill="#F7A928"/>
    <text x="647" y="759" class="small" fill="#312B44">CRM/SOP 转化</text>
    <circle cx="345" cy="736" r="12" fill="#F05C72"/>
    <text x="364" y="743" class="small" fill="#312B44">LLM 评测与选型</text>

    <text x="888" y="660" class="sans label" fill="#7D62F4">BUILD NEXT / 优先补足</text>
    <rect x="888" y="690" width="594" height="180" rx="20" fill="#FFF8F1"/>
    <text x="932" y="742" class="h2" fill="#382E24">01  模型质量、延迟、成本</text>
    <text x="932" y="782" class="body" fill="#695E53">理解为何选模型，而不是只会用模型</text>
    <text x="932" y="832" class="h2" fill="#382E24">02  评测与人工接管</text>
  </g>

  <rect x="118" y="890" width="1364" height="1" fill="#E7E5F0"/>
  <text x="118" y="922" class="sans small" fill="#777184">NEXT ACTION</text>
  <text x="270" y="922" class="sans body" font-weight="700" fill="#5037D5">用 AI Career Sprint Plan 补 AI 产品决策语言</text>
  <text x="1405" y="922" class="mono" font-size="16" fill="#777184">v0.1</text>
</svg>
